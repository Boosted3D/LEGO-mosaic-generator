<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; background: transparent; }
      body { overflow: hidden; }
      #selector { width: 100%; height: 38px; overflow-x: auto; overflow-y: hidden; }
      #swatches { min-width: max-content; height: 36px; display: flex; align-items: center; gap: 9px; padding: 2px 3px; box-sizing: border-box; }
      .swatch { width: 24px; height: 24px; flex: 0 0 24px; padding: 0; box-sizing: border-box;
        border: 2px solid #171a20; outline: 1px solid #727985; border-radius: 50%; cursor: pointer;
        transition: background-color .12s ease, outline-color .12s ease, transform .12s ease; }
      .swatch[aria-pressed="true"] { outline: 2px solid #fff; outline-offset: 1px; }
      .swatch[aria-pressed="false"] { outline-color: #727985; }
      .swatch:hover { transform: scale(1.08); outline: 2px solid #fff; outline-offset: 1px; }
      .swatch:focus-visible { outline: 2px solid #00ae42; outline-offset: 2px; }
      #status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <div id="selector"><div id="swatches" role="group" aria-label="Bambu Lab color selector"></div></div>
    <span id="status" aria-live="polite"></span>
    <script src="main.js"></script>
  </body>
</html>
