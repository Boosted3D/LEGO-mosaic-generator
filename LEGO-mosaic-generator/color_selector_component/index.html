<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; background: transparent; }
      body { overflow: hidden; }
      #selector {
        width: 100%;
        height: 44px;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
      #selector::-webkit-scrollbar { display: none; }
      #swatches {
        display: flex;
        align-items: center;
        gap: 8px;
        width: max-content;
        min-width: 100%;
        height: 44px;
        padding: 6px 8px;
        box-sizing: border-box;
      }
      .swatch {
        display: block;
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        padding: 0;
        box-sizing: border-box;
        border: 1px solid #828995;
        border-radius: 50%;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        transition: border-color .12s ease, border-width .12s ease;
      }
      .swatch[aria-pressed="true"] { border: 2px solid #22c55e; }
      .swatch:hover { border-color: #e7ebef; }
      .swatch[aria-pressed="true"]:hover { border-color: #22c55e; }
      .swatch:focus { outline: none; }
      .swatch:focus-visible { box-shadow: 0 0 0 1px #0e1117, 0 0 0 2px #22c55e; }
      #status {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="selector" role="group" aria-label="Bambu Lab color selector">
      <div id="swatches"></div>
    </div>
    <span id="status" aria-live="polite"></span>
    <script src="main.js"></script>
  </body>
</html>
